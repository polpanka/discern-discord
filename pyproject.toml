[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discern-discord"
version = "0.3.4"
description = "Colored Discord notification indicator for Linux — red for DM/@mention, blue for generic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Paolo Pancaldi", email = "pancaldi.paolo@gmail.com"}]
keywords = ["discord", "notifications", "linux", "tray", "indicator", "dbus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "dbus-python>=1.2",
    "PyGObject>=3.42",
]

[project.urls]
Homepage = "https://github.com/polpanka/discern-discord"
Repository = "https://github.com/polpanka/discern-discord"
Issues = "https://github.com/polpanka/discern-discord/issues"

[project.scripts]
discern-discord = "discern_discord.notifier:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
discern_discord = ["icons/*.svg"]
